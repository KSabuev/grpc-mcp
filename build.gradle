plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'io.grpc.mcp'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'io.grpc.mcp.McpServerApplication'
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    grpcVersion = '1.76.0'
    protobufVersion = '4.28.3'
    mcpSdkVersion = '2.0.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.retry:spring-retry'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // MCP Java SDK (BOM + core + Jackson2 for Spring Boot compatibility)
    implementation platform("io.modelcontextprotocol.sdk:mcp-bom:${mcpSdkVersion}")
    implementation 'io.modelcontextprotocol.sdk:mcp-core'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2'

    // gRPC and protobuf
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-api:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    // gRPC Server Reflection client
    implementation "io.grpc:grpc-services:${grpcVersion}"

    // protobuf JSON format
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    // JSON Schema validator
    implementation 'com.github.java-json-tools:json-schema-validator:2.2.14'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('bootJar') {
    archiveFileName.set("grpc-mcp-${project.version}.jar")
}

bootBuildImage {
    imageName = "grpc-mcp:${project.version}"
}

test {
    useJUnitPlatform()
}
